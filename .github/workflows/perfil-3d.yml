# Gera o gráfico 3D das contribuições usado no README (pasta perfil-3d/), uma vez por dia.
name: Gráfico 3D das contribuições

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Guarda os SVGs em perfil-3d/
        run: |
          mkdir -p perfil-3d
          cp profile-3d-contrib/*.svg perfil-3d/
          rm -rf profile-3d-contrib
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add perfil-3d
          git diff --cached --quiet || git commit -m "Atualiza o gráfico 3D das contribuições"
          git push
