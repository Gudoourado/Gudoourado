<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Gustavo Dourado, desenvolvedor full stack com foco em back-end">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb4e8"/>
      <stop offset="0.6" stop-color="#a9dcf5"/>
      <stop offset="1" stop-color="#e6f6fb"/>
    </linearGradient>
    <radialGradient id="sol" cx="0.82" cy="0.18" r="0.35">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="morro1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9bd58a"/>
      <stop offset="1" stop-color="#6fb866"/>
    </linearGradient>
    <linearGradient id="morro2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cbf5f"/>
      <stop offset="1" stop-color="#3f9a4c"/>
    </linearGradient>
    <linearGradient id="morro3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4caa52"/>
      <stop offset="1" stop-color="#2f7d3f"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1d4e6b" flood-opacity="0.45"/>
    </filter>
    <g id="nuvem">
      <ellipse cx="0" cy="0" rx="58" ry="22" fill="#ffffff"/>
      <ellipse cx="-34" cy="6" rx="36" ry="18" fill="#ffffff"/>
      <ellipse cx="36" cy="5" rx="40" ry="19" fill="#ffffff"/>
      <ellipse cx="-6" cy="-16" rx="34" ry="22" fill="#ffffff"/>
      <ellipse cx="0" cy="12" rx="70" ry="10" fill="#dceff8"/>
    </g>
    <style>
      .devagar { animation: vai 70s linear infinite; }
      .rapida { animation: vai 45s linear infinite; }
      @keyframes vai { from { transform: translateX(-260px); } to { transform: translateX(1460px); } }
      .rabo { transform-origin: 1003px 262px; animation: abana 2.4s ease-in-out infinite; }
      @keyframes abana { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
      .olho { animation: pisca 5s infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pisca { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
      @media (prefers-reduced-motion: reduce) { .devagar, .rapida, .rabo, .olho { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#ceu)"/>
  <rect width="1200" height="340" fill="url(#sol)"/>
  <circle cx="985" cy="62" r="30" fill="#fffbe8"/>

  <g class="devagar"><use href="#nuvem" x="120" y="70" opacity="0.95"/></g>
  <g class="rapida" style="animation-delay:-20s"><use href="#nuvem" x="420" y="118" transform="scale(0.8)" opacity="0.9"/></g>
  <g class="devagar" style="animation-delay:-38s"><use href="#nuvem" x="700" y="52" opacity="0.92"/></g>
  <g class="rapida" style="animation-delay:-8s"><use href="#nuvem" x="980" y="150" transform="scale(0.7)" opacity="0.85"/></g>

  <path d="M0 250 C 160 200, 320 215, 470 240 S 820 205, 980 228 S 1150 220, 1200 214 L1200 340 L0 340 Z" fill="url(#morro1)"/>
  <path d="M0 282 C 200 245, 380 262, 560 280 S 900 250, 1200 268 L1200 340 L0 340 Z" fill="url(#morro2)"/>
  <path d="M0 310 C 240 290, 520 300, 760 312 S 1060 296, 1200 302 L1200 340 L0 340 Z" fill="url(#morro3)"/>

  <g fill="#2f7d3f">
    <ellipse cx="180" cy="236" rx="16" ry="22"/><rect x="178" y="250" width="4" height="12"/>
    <ellipse cx="208" cy="242" rx="11" ry="16"/><rect x="206" y="252" width="4" height="10"/>
    <ellipse cx="1110" cy="226" rx="15" ry="21"/><rect x="1108" y="240" width="4" height="12"/>
  </g>
  <g>
    <circle cx="90" cy="318" r="3.5" fill="#fff4b0"/><circle cx="300" cy="322" r="3" fill="#ffffff"/>
    <circle cx="640" cy="318" r="3.5" fill="#ffd1dc"/><circle cx="880" cy="324" r="3" fill="#fff4b0"/>
    <circle cx="1150" cy="320" r="3.5" fill="#ffffff"/><circle cx="450" cy="326" r="2.5" fill="#ffd1dc"/>
  </g>

  <g>
    <path class="rabo" d="M1003 262 C 1030 258, 1036 232, 1024 220" stroke="#1f2328" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="985" cy="262" rx="26" ry="22" fill="#1f2328"/>
    <circle cx="980" cy="232" r="19" fill="#1f2328"/>
    <path d="M965 222 L962 204 L976 216 Z" fill="#1f2328"/>
    <path d="M995 222 L998 204 L984 216 Z" fill="#1f2328"/>
    <ellipse class="olho" cx="973" cy="232" rx="4" ry="5" fill="#4ade80"/>
    <ellipse class="olho" cx="988" cy="232" rx="4" ry="5" fill="#4ade80"/>
  </g>

  <g filter="url(#sombra)" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="600" y="128" font-size="62" font-weight="700">Gustavo Dourado</text>
    
  </g>
  <text x="600" y="172" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#17425a" text-anchor="middle">Desenvolvedor Full Stack · foco em back-end</text>
</svg>
